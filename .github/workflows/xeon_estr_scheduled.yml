name: Aggiornamento €STR per XEON

on:
  schedule:
    - cron: "15 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-estr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Download latest ECB €STR observation
        run: python py/download_ecb_estr.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add json/xeon_estr.json
          git diff --cached --quiet || git commit -m "Aggiornamento serie €STR per XEON"
          git push
